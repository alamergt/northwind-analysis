name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Check docstrings against the course SKILL.md
        run: python verification/check_docstrings.py northwind run_analysis.py verification tests
      - name: Run tests
        run: python -m pytest -q
      - name: Rebuild every table, chart and the page
        run: python run_analysis.py
      - name: Check the committed page matches the rebuild
        run: python verification/check_site_current.py
